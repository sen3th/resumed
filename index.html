<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumed</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="container">
        <section class="panel">
            <h1>Resumed</h1>
            <form id="resumeForm">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="enter your name"/>

                <label for="email">Email</label>
                <input id="email" name="email" type="text" placeholder="hi@seneth.me"/>

                <label for="phone">Phone</label>
                <input id="phone" name="phone" type="text" placeholder="135-456-6767"/>
            </form>
        </section>

        <section class="panel" id="previewPanel">
            <div id="resumePreview">
                <h2 id="previewName">Your Name</h2>
                <div id="previewContactinfo">
                    <span id="previewEmail">example@example.com</span> ,
                    <span id="previewPhone">124-456-6767</span>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
