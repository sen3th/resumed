<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumed</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="container">
        <section class="panel">
            <div id="saveStatus"></div>
            <button type="button" id="clearResume" class="sectionButton">Clear</button>
            <h1>Resumed</h1>
            <form id="resumeForm">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="enter your name"/>

                <label for="email">Email</label>
                <input id="email" name="email" type="text" placeholder="example@example.com"/>

                <label for="phone">Phone</label>
                <input id="phone" name="phone" type="text" placeholder="135-456-6767"/>

                <div id="education">
                    <label>Education</label>
                    <div id="education-list"></div>
                    <button type="button" id="addEducation" class="sectionButton">Add</button>
                </div>
                <div id="experience">
                    <label>Experience</label>
                    <div id="experience-list"></div>
                    <button type="button" id="addExperience" class="sectionButton">Add</button>
                </div>
                <div id="skills">
                    <label>Skills</label>
                    <div id="skills-list"></div>
                    <button type="button" id="addSkill" class="sectionButton">Add</button>
                </div>
            </form>
        </section>

        <section class="panel" id="previewPanel">
            <div id="resumePreview">
                <h2 id="previewName">Your Name</h2>
                <div id="previewContactinfo">
                    <span id="previewEmail">example@example.com</span>,
                    <span id="previewPhone">124-456-6767</span>
                </div>
                <div id="previewEducation"></div>
                <div id="previewExperience"></div>
                <div id="previewSkills"></div>
                <button type="button" id="exportPdfButton" class="sectionButton no-print">Export</button>
            </div>
            <div id="pdfPreview" class="pdf">
                <div class="pdf-header">
                    <div id="pdfName" class="pdf-name">Your Name</div>
                    <div class="pdf-contact">
                        <span id ="pdf-email">example@example.com</span> . 
                        <span id="pdf-phone">123-456-7890</span>
                    </div>
                </div>
                <div id="pdfEducation"></div>
                <div id="pdfExperience"></div>
                <div id="pdfSkills"></div>
            </div>
        </section>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
